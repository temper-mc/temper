# Temper Project workspace
#
# Layout of this file:
# - Members of the workspace.
# - Profile compilation settings.
# - Workspace lints
# - Workspace dependencies.


[workspace]
resolver = "2"

#================= Members =================#
members = [
    "src/adapters/anvil",
    "src/adapters/nbt",
    "src/app",
    "src/base/general_purpose",
    "src/base/logging",
    "src/base/macros",
    "src/base/profiling",
    "src/base/threadpool",
    "src/bin",
    "src/commands",
    "src/components",
    "src/core",
    "src/dashboard",
    "src/data",
    "src/default_commands",
    "src/entities",
    "src/game_systems",
    "src/game_systems/src/background",
    "src/game_systems/src/interactions",
    "src/game_systems/src/mobs",
    "src/game_systems/src/pathfinding",
    "src/game_systems/src/packets",
    "src/game_systems/src/physics",
    "src/game_systems/src/player",
    "src/game_systems/src/world",
    "src/inventories",
    "src/messages",
    "src/net/codec",
    "src/net/encryption",
    "src/net/protocol",
    "src/net/runtime",
    "src/particles",
    "src/performance",
    "src/permissions",
    "src/physics",
    "src/registry",
    "src/resources",
    "src/scheduler",
    "src/state",
    "src/storage",
    "src/text",
    "src/utils",
    "src/world",
    "src/world/block-placing",
    "src/world/db",
    "src/world/format",
    "src/world/gen",
    "tests",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

#================== Lints ==================#
[workspace.lints.rust]
unsafe_code = "allow"
unused_unsafe = "deny"
#unsafe_op_in_unsafe_fn = "deny"
#unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
missing_abi = "deny"
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
borrow_as_ptr = "deny"
case_sensitive_file_extension_comparisons = "deny"
cast_lossless = "deny"
cast_ptr_alignment = "deny"
match_bool = "deny"
mut_mut = "deny"
wildcard_dependencies = "deny"
redundant_type_annotations = "deny"
infinite_loop = "deny"
type_complexity = "allow"

#================= Profile =================#
[profile.profiling]
inherits = "release"
debug = true

[profile.release]
debug = true

# This profile is used for release builds
[profile.hyper]
inherits = "release"
strip = "symbols"
lto = true
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1

[profile.bench]
debug = true

#=============== Dependencies ==============#
[workspace.dependencies]
# Workspace members
temper-app = { path = "src/app" }
temper-anvil = { path = "src/adapters/anvil" }
temper-config = { path = "src/config" }
temper-core = { path = "src/core" }
temper-default-commands = { path = "src/default_commands" }
temper-commands = { path = "src/commands" }
temper-general-purpose = { path = "src/base/general_purpose" }
temper-logging = { path = "src/base/logging" }
temper-macros = { path = "src/base/macros" }
temper-nbt = { path = "src/adapters/nbt" }
temper-net-runtime = { path = "src/net/runtime" }
temper-performance = { path = "src/performance" }
temper-codec = { path = "src/net/codec" }
temper-protocol = { path = "src/net/protocol" }
temper-encryption = { path = "src/net/encryption" }
temper-profiling = { path = "src/base/profiling" }
temper-registry = { path = "src/registry" }
temper-scheduler = { path = "src/scheduler" }
temper-state = { path = "src/state" }
temper-storage = { path = "src/storage" }
temper-text = { path = "src/text" }
temper-threadpool = { path = "src/base/threadpool" }
temper-utils = { path = "src/utils" }
temper-world = { path = "src/world" }
temper-world-gen = { path = "src/world/gen" }
temper-world-format = { path = "src/world/format" }
temper-inventories = { path = "src/inventories" }
temper-data = { path = "src/data" }
temper-components = { path = "src/components" }
temper-dashboard = { path = "src/dashboard" }
temper-messages = { path = "src/messages" }
temper-entities = { path = "src/entities" }
temper-physics = { path = "src/physics" }
temper-particles = { path = "src/particles" }
temper-resources = { path = "src/resources" }
temper-game-systems = { path = "src/game_systems" }
interactions = { path = "src/game_systems/src/interactions" }
temper-permissions = { path = "src/permissions" }

# Asynchronous
tokio = { version = "1.52.1", features = [
    "macros",
    "net",
    "rt",
    "sync",
    "time",
    "io-util",
    "test-util",
    "rt-multi-thread"
], default-features = false }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tracing-tracy = { version = "0.11.4", features = ["timer-fallback", "ondemand", "fibers", "context-switch-tracing", "delayed-init"] }
log = "0.4.29"
tracy-client = "0.18.4"

# Concurrency/Parallelism
parking_lot = "0.12.5"
rayon = "1.12.0"
crossbeam-channel = "0.5.15"
rusty_pool = "0.7.0"
crossbeam-queue = "0.3.12"

# Network
reqwest = { version = "0.13.3", features = ["json", "native-tls", "blocking", "http2"], default-features = false }

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Cryptography
rand = "0.10.1"
fnv = "1.0.7"
wyhash = "0.6.0"
ahash = "0.8.12"
rsa = { version = "0.10.0-rc.17" }
aes = { version = "0.8.4" }
cfb8 = "0.8.1"
sha1 = "0.11.0"
num-bigint = "0.4.6"

# Encoding/Serialization
serde = { version = "1.0.228", features = ["derive", "std", "rc"] }
serde_json = "1.0.149"
serde_derive = "1.0.228"
base64 = "0.22.1"

bitcode = "0.6.9"
bitcode_derive = "0.6.9"
toml = "1.1.2+spec-1.1.0"
craftflow-nbt = "2.1.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
simd-json = "0.17.0"
bytemuck = { version = "1.25.0", features = ["extern_crate_alloc", "derive"] }
serde_yaml_ng = "0.10.0"

# Bit manipulation
byteorder = "1.5.0"

# Data types
dashmap = { version = "7.0.0-rc2", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "v3", "serde"] }
indexmap = { version = "2.14.0", features = ["serde"] }
bimap = "0.6.3"
arrayvec = "0.7.6"

# Macros
lazy_static = "1.5.0"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["extra-traits"] }
proc-macro2 = "1.0.106"
paste = "1.0.15"
maplit = "1.0.2"
macro_rules_attribute = "0.2.2"
type_hash = "0.3.0"

# Magic
dhat = "0.3.3"
ctor = "1.0.0"

# Compression/Decompression
yazi = "0.2.1"
flate2 = "1.1.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }


# Database
heed = "0.22.1"

# Misc
deepsize = "0.2.0"
page_size = "0.6.0"
enum-ordinalize = "4.3.2"
regex = "1.12.3"
noise = "0.9.0"
ctrlc = "3.5.2"
num_cpus = "1.17.0"
typename = "0.1.2"
bevy_ecs = { version = "0.18.1", features = ["multi_threaded", "trace", "debug"], default-features = false }
bevy_math = { version = "0.18.1", features = ["serialize"] }
rustc-hash = "2.1.2"
once_cell = "1.21.4"
mime_guess = "2.0.5"

## TUI/CLI
crossterm = "0.29.0"
ratatui-core = "0.1.0"
tui-input = "0.15.3"
ratatui = "0.30.0"
tui-logger = { version = "0.18.2", features = ["tracing-support", "crossterm"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
indicatif = "0.18.4"
colored = "3.1.1"
unicode-width = "0.2.2"
heck = "0.5.0"

# I/O
memmap2 = "0.9.10"
tempfile = "3.27.0"
walkdir = "2.5.0"
include_dir = "0.7.4"

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports"] }

phf = { version = "0.13.1", features = ["macros"] }
phf_codegen = { version = "0.13.1" }

# Web server
axum = { version = "0.8.9", features = ["tokio", "ws"] }

# Stats
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
dir-size = "0.1.1"

# Compression is a real bottleneck that we can do little about, so compiling it with optimizations is needed in dev mode.
[profile.dev.package.yazi]
opt-level = 3
